<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      const repo = "/neural-nexus";
      const path = location.pathname.replace(repo, "");
      sessionStorage.setItem("redirect", path);
      location.replace(repo + "/");
    </script>
  </head>
  <body></body>
</html>
